tags:
- name: auth
  description: Sign in and out, the current user and password changes.
- name: apps
  description: 'The application catalog: apps with capabilities, tags and maintainers.'
- name: interfaces
  description: Interfaces between apps and external systems, and the landscape graph.
- name: search
  description: Explainable matching of requirements against the catalog.
- name: import
  description: CSV and JSON import, export and templates.
- name: tags
  description: Tags, tech stack and domains shared by apps.
- name: maintainers
  description: People and teams that own or maintain apps.
- name: users
  description: User accounts and roles (admin only).
- name: admin
  description: Embedding index status, reindexing and logs (admin only).
- name: meta
  description: Enum values and search settings for clients.
- name: health
  description: Liveness and readiness probes.
