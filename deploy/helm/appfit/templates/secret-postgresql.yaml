{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "appfit.postgresql.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "appfit.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  annotations:
    # The data volume outlives an uninstall, and PostgreSQL keeps the password it was created with.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_PASSWORD: {{ include "appfit.secretValue" (dict "root" . "secret" $name "key" "POSTGRES_PASSWORD" "value" .Values.postgresql.auth.password) | b64enc | quote }}
{{- end }}
