{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
{{- if not .Values.externalDatabase.url }}
{{- fail "Set externalDatabase.url or externalDatabase.existingSecret when postgresql.enabled is false" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appfit.component" (dict "root" . "name" "database") }}
  labels:
    {{- include "appfit.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.externalDatabase.url | b64enc | quote }}
{{- end }}
