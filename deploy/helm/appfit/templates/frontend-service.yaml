apiVersion: v1
kind: Service
metadata:
  name: {{ include "appfit.component" (dict "root" . "name" "frontend") }}
  labels:
    {{- include "appfit.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "appfit.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
