{{- if not .Values.auth.existingSecret }}
{{- $name := include "appfit.appSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "appfit.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: sessions and the admin password stay valid on a reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_SECRET: {{ include "appfit.secretValue" (dict "root" . "secret" $name "key" "JWT_SECRET" "value" .Values.auth.jwtSecret) | b64enc | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ include "appfit.secretValue" (dict "root" . "secret" $name "key" "BOOTSTRAP_ADMIN_PASSWORD" "value" .Values.auth.bootstrapAdmin.password) | b64enc | quote }}
{{- end }}
