{{- if and .Values.modelCache.persistence.enabled (not .Values.modelCache.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "appfit.modelCacheClaim" . }}
  labels:
    {{- include "appfit.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
  annotations:
    # The model download (about 2.2 GB) survives uninstall.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.modelCache.persistence.accessModes | nindent 4 }}
  {{- with .Values.modelCache.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelCache.persistence.size }}
{{- end }}
