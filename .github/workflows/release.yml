name: Release

# Push a tag such as v0.1.0 to publish images and the Helm chart to GHCR and create the GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Tag matches every version in the repository
        run: |
          version="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml)
          app=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/src/appfit/__init__.py)
          ui=$(sed -n 's/^  "version": "\(.*\)",/\1/p' frontend/package.json)
          chart=$(sed -n 's/^version: *//p' deploy/helm/appfit/Chart.yaml)
          chart_app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' deploy/helm/appfit/Chart.yaml)
          for v in "$py" "$app" "$ui" "$chart" "$chart_app"; do
            if [ "$v" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match: pyproject=$py app=$app package.json=$ui chart=$chart appVersion=$chart_app"
              exit 1
            fi
          done
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: Publish ${{ matrix.component }} image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            target: ""
          - component: frontend
            target: prod
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/appfit-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  chart:
    name: Publish Helm chart
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Point the chart at the published images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sed -i "s|repository: appfit-backend|repository: ghcr.io/$owner/appfit-backend|; s|repository: appfit-frontend|repository: ghcr.io/$owner/appfit-frontend|" \
            deploy/helm/appfit/values.yaml
          grep -q "ghcr.io/$owner/appfit-backend" deploy/helm/appfit/values.yaml
      - run: helm package deploy/helm/appfit --destination dist
      - name: Push to ghcr.io/<owner>/charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/appfit-${{ needs.version.outputs.version }}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/*.tgz

  release:
    name: GitHub release
    needs: [version, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]*\]: / {next}
            found {print}
          ' CHANGELOG.md > notes.md
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat >> notes.md <<EOF

          ### Install
          \`\`\`bash
          helm install appfit oci://ghcr.io/$owner/charts/appfit --version ${{ needs.version.outputs.version }} -n appfit --create-namespace
          \`\`\`
          Images: \`ghcr.io/$owner/appfit-backend:${{ needs.version.outputs.version }}\`, \`ghcr.io/$owner/appfit-frontend:${{ needs.version.outputs.version }}\`
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*.tgz
