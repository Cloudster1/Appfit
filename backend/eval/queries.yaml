# Labelled evaluation queries for Appfit matching.
# relevant: graded relevance per app slug (2 = ideal match, 1 = acceptable).
# expect_no_match: true means no app in seed_apps.json covers the use case.
# Retired apps are never labelled (default search excludes them).
