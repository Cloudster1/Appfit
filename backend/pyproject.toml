[project]
name = "appfit"
version = "0.1.0"
description = "Application catalog with explainable requirement matching"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "typer>=0.15",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "python-slugify>=8.0",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5",
    "sentence-transformers>=3.3",
]

[project.scripts]
appfit = "appfit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "schemathesis>=4",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appfit"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: tests that load the real embedding model (opt-in: pytest -m model)",
]
addopts = "-m 'not model'"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["appfit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
