name: appfit

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appfit}
      POSTGRES_USER: ${POSTGRES_USER:-appfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appfit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-appfit}:${POSTGRES_PASSWORD:-appfit}@db:5432/${POSTGRES_DB:-appfit}
      HF_HOME: /models
    volumes:
      - hf-cache:/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${APPFIT_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  hf-cache:
